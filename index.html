 L.R=R;$('#sr').innerHTML=`<p>${R.length} records · ${hv?H(hv)+' collection':'Total'}: <b>${inr(R.filter(valid).reduce((a,r)=>a+amt(r),0))}</b></p><table><tr><th>Book/Sl</th><th>Date</th><th>Name</th><th>Roll</th><th>Purpose</th><th>Mode</th><th>${hv?'Amount ('+H(hv)+')':'Amount'}</th><th class="np">Actions</th></tr>${R.map(r=>`<tr style="${r.cancelled?'background:#fff1f2':''}"><td>${bookOf(r.book).sl}/${r.serial}${r.cancelled?' <span class="pill" style="background:#fecaca;color:#991b1b;margin:0">CANCELLED</span>':''}${r.dups?' <small title="duplicate copies issued">📄'+r.dups+'</small>':''}</td><td>${r.date}</td><td>${H(r.name)}</td><td>${H(r.roll)}</td><td>${[...new Set(r.items.map(i=>i.head))].map(H).join(', ')}</td><td>${H(r.mode)}</td><td style="${r.cancelled?'text-decoration:line-through;opacity:.6':''}">${inr(amt(r))}</td><td class="np" style="white-space:nowrap"><button class="s" onclick="showR(${r.id})">👁 View</button> <button class="s" onclick="dupR(${r.id})">📄 Duplicate</button> <button class="s" onclick="stmt(decodeURIComponent('${enc(r.roll)}'))">🧾 Statement</button> <button class="s" onclick="if(askPw()){editId=${r.id};tab='add';nav();view()}">✏️ Edit</button> ${r.cancelled?(ULTRA?`<button class="s" onclick="restoreR(${r.id})">↩ Restore</button>`:''):`<button class="x" onclick="cancelR(${r.id})">🚫 Cancel</button>`}${ULTRA?` <button class="x" onclick="delR(${r.id})">🗑 Delete</button>`:''}</td></tr>`).join('')}</table>`}
function delR(id){if(!ULTRA)return;const r=S.receipts.find(x=>x.id==id);if(!r||!confirm('Delete receipt '+bookOf(r.book).sl+'/'+r.serial+' of '+r.name+' permanently?'))return;
 if(prompt('Enter the ULTRA password again to delete')!==ULTRA_PW)return alert('Wrong password. Receipt NOT deleted.');
 (S.deletedLog=S.deletedLog||[]).push({at:new Date().toISOString(),book:bookOf(r.book).sl,serial:r.serial,name:r.name,roll:r.roll,amount:tot(r)});

function editBook(id){const b=bookOf(id);if(!b)return;

function saveBook(id){const b=bookOf(id),o={sl:+$('#eb_s').value,date:$('#eb_d').value,from:+$('#eb_f').value,to:+$('#eb_t').value,staff:$('#eb_n').value.trim()};
 if(!o.sl||!o.date||!o.staff||o.to<o.from)return alert('Enter valid book number, date, staff and range');if(S.books.some(x=>x.id!=id&&x.sl==o.sl))return alert('Another book already has this number');
 const used=S.receipts.filter(r=>r.book==id).flatMap(r=>[+r.serial].concat(r.skipped||[]));if(used.length&&(Math.min(...used)<o.from||Math.max(...used)>o.to))return alert('Range must still cover the serials already used ('+Math.min(...used)+' to '+Math.max(...used)+')');

 if(R.length&&!ULTRA)return alert('Book '+b.sl+' already has '+R.length+' receipt(s).\nOnly the Ultra admin can delete a book that contains receipts.');

 if(R.length&&prompt('Type DELETE to confirm deleting the book and its receipts')!=='DELETE')return alert('Cancelled. Nothing deleted.');if(!askPw())return;
 (S.deletedLog=S.deletedLog||[]).push({at:new Date().toISOString(),book:b.sl,staff:b.staff,receiptsDeleted:R.length});S.books=S.books.filter(x=>x.id!=id);S.receipts=S.receipts.filter(r=>r.book!=id);save();view();toast('🗑 Receipt book deleted')}

 if(!o.staff||o.to<o.from)return alert('Enter staff and a valid range');if(S.books.some(b=>b.sl==o.sl))return alert('Book number exists');if(!askPw())return;o.id=Date.now();S.books.push(o);save();view()}

 v.forEach(r=>{mode[r.mode]=(mode[r.mode]||0)+tot(r);r.items.forEach(i=>head[i.head]=(head[i.head]||0)+ +i.amt)});

 reg=R.map(r=>[r.serial,r]).concat(sk.map(([n,w])=>[n,{sk:w}])).sort((a,d)=>a[0]-d[0]),

 const sum=`<div class="rc sum"><div class="inner"><div class="hd">${c.logo?`<img src="${c.logo}">`:''}<div class="t"><h2>${H(c.name)}</h2><small>${H(c.addr)}</small></div></div>
 <div class="ttl"><h4>RECEIPT BOOK SUMMARY</h4><span class="tag">BOOK No. ${b.sl}</span></div>

 <tr><td class="k">Issued on</td><td>${b.date}</td><td class="k">Assigned staff</td><td>${H(b.staff)}</td></tr>
 <tr><td class="k">Receipts issued</td><td>${R.length} (valid ${v.length})</td><td class="k">Cancelled</td><td>${R.length-v.length}</td></tr>
 <tr><td class="k">Skipped serials</td><td>${sk.length}</td><td class="k">Unused serials</td><td>${Math.max(0,size-used)}</td></tr></table>
 <div class="big"><span>TOTAL COLLECTION (valid receipts)</span><span>${inr(total)}</span></div>
 <div class="two"><div>${tb(mode,'Payment mode')}</div><div>${tb(head,'Purpose / fee head')}</div></div>
 <h5>Register — sequence wise</h5><table class="fee sm"><tr><th>Sl</th><th>Date</th><th>Student</th><th>Roll</th><th>Mode</th><th class="r">Amount</th><th>Status</th></tr>
 ${reg.map(([n,r])=>r.sk!==undefined?`<tr><td>${n}</td><td colspan="5" style="color:#92400e">SKIPPED — ${H(r.sk)}</td><td>Skipped</td></tr>`:`<tr style="${r.cancelled?'color:#991b1b':''}"><td>${n}</td><td>${r.date}</td><td>${H(r.name)}</td><td>${H(r.roll)}</td><td>${H(r.mode)}</td><td class="r">${inr(tot(r))}</td><td>${r.cancelled?'Cancelled':'Valid'}</td></tr>`).join('')}</table>
 <div class="note">Generated on ${today()} · Summary page followed by all receipts of this book in serial order.</div></div></div>`;
 const w=open('','_blank');if(!w)return alert('Allow pop-ups for this site, then try again');
 w.document.write('<!DOCTYPE html><meta charset="utf-8"><title>Receipt Book '+b.sl+'</title><style>'+document.querySelector('style').textContent+'</style><style>body{background:#fff!important;padding:0!important;display:block}.pg{padding:10mm}.pg+.pg{page-break-before:always}.pg .rc:not(.sum){font-size:14.5px}.pg .rc:not(.sum) .inner{padding:11mm 11mm 9mm}.pg .rc:not(.sum) .hd h2{font-size:25px}.pg .rc:not(.sum) .hd img{height:84px}.pg .rc:not(.sum) .info td,.pg .rc:not(.sum) .fee td{padding:9px 10px;font-size:14px}.pg .rc:not(.sum) .fee th{padding:9px 10px;font-size:12px}.pg .rc:not(.sum) .grand td{font-size:17px}.pg .rc:not(.sum) .foot{margin-top:40px}.pg .rc:not(.sum) .words{font-size:14px;padding:10px 12px}@media screen{.pg{max-width:210mm;margin:0 auto;border-bottom:2px dashed #94a3b8}}</style><div class="pg">'+sum+'</div>'+R.map(r=>'<div class="pg">'+rcHTML(r)+'</div>').join('')+'<script>onload=()=>setTimeout(print,500)<\/script>');w.document.close()}

 $('#mb').innerHTML=`<h3>Edit Student</h3><div class="g"><div><label>Roll / ID No.</label><input id="es_r" value="${H(s.roll)}"></div><div><label>Full name</label><input id="es_n" value="${H(s.name)}"></div>

 if(r.toLowerCase()!=String(old).toLowerCase()&&S.students.some(x=>String(x.roll).toLowerCase()==r.toLowerCase()))return alert('Another student already has this roll number');if(!askPw())return;

V.sec=()=>`<div class="card"><h3>Security — Change Password</h3><label>Current password</label><input id="o" type="password"><label>New password</label><input id="n1" type="password"><label>Confirm new password</label><input id="n2" type="password"><button class="w" onclick="chPw()">Change Password</button><p><small>The Ultra admin password cannot be changed by anyone.</small></p></div>`;
function chPw(){if($('#o').value!==S.pw)return alert('Current password wrong');if($('#n1').value.length<6||$('#n1').value!==$('#n2').value)return alert('New passwords must match (min 6 chars)');S.pw=$('#n1').value;save();alert('Password changed');view()}
V.ultra=()=>{const c=S.college,l=S.limit;return `<div class="card"><h3>1. College Details & QR</h3><div class="g"><div><label>College name</label><input id="cn" value="${H(c.name)}"></div><div><label>Address</label><input id="ca" value="${H(c.addr)}"></div><div><label>Phone</label><input id="cp" value="${H(c.phone)}"></div><div><label>Email</label><input id="ce" value="${H(c.email)}"></div><div><label>Website</label><input id="cw" value="${H(c.web)}"></div><div><label>Watermark text (empty = none)</label><input id="cm" value="${H(c.wmText)}"></div></div>
 <label>Bank & payment details</label><input id="cb" value="${H(c.bank)}"><div class="g"><div><label>Main logo</label><input type="file" id="fl" accept="image/*"><label style="font-weight:400"><input type="checkbox" id="rl" style="width:auto"> Remove logo</label></div><div><label>Watermark image</label><input type="file" id="fw" accept="image/*"><label style="font-weight:400"><input type="checkbox" id="rw" style="width:auto"> Remove watermark image</label></div><div><label>Payment QR image</label><input type="file" id="fq" accept="image/*"><label style="font-weight:400"><input type="checkbox" id="rq" style="width:auto"> Remove QR</label></div></div><button class="w" onclick="saveCol()">Save College Details</button></div>
 <div class="card"><h3>2. Annual Receipt Limit</h3><div class="g"><div><label>From date</label><input type="date" id="lf" value="${l.from}"></div><div><label>To date</label><input type="date" id="lt" value="${l.to}"></div><div><label>No. of receipts</label><input type="number" id="lm" value="${l.max}"></div></div><button class="w" onclick="S.limit={from:lf.value,to:lt.value,max:+lm.value};save();alert('Saved')">Save Limit</button></div>
 <div class="card"><h3>3. Backup stored here</h3><button class="s" onclick="lastBak()">⬇ Download last stored backup (JSON)</button></div>
 <div class="card"><h3>4. Reset whole website</h3><button class="x" onclick="resetAll()">Reset all data</button> <button class="s" onclick="undoReset()">↩ Undo reset</button><p><small>Delete individual receipts from Search & Records (Del button).</small></p></div>`};
async function saveCol(){const c=S.college;Object.assign(c,{name:cn.value,addr:ca.value,phone:cp.value,email:ce.value,web:cw.value,wmText:cm.value,bank:cb.value});
 const [a,b,q]=await Promise.all([file2url(fl.files[0]),file2url(fw.files[0]),file2url(fq.files[0])]);if(rl.checked)c.logo='';if(rw.checked)c.wmImg='';if(rq.checked)c.qr='';if(a)c.logo=a;if(b)c.wmImg=b;if(q)c.qr=q;await save();brand();alert('Saved')}
async function lastBak(){const b=await get('lastBackup');b?dl('last-backup.json',b.json,'application/json'):alert('No backup stored yet. Export one from Backup & Restore.')}
async function resetAll(){if(prompt('Confirm ultra password (1/2)')!==ULTRA_PW)return;if(prompt('Confirm ultra password again (2/2)')!==ULTRA_PW)return;await put('undo',S);S=fresh();await save();brand();alert('Website reset. You can undo this from the Ultra tab.');view()}
async function undoReset(){const u=await get('undo');if(!u)return alert('Nothing to undo');if(!confirm('Restore data from before the reset?'))return;S=u;await save();brand();alert('Restored');view()}

/* ---------- print engine (PDF via browser print) ---------- */
const DCSS=`@page{size:A4;margin:0}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font:12px/1.45 "Segoe UI",Arial,sans-serif;color:#0f172a}
.flow{width:100%;border-collapse:collapse}.flow>thead>tr>td,.flow>tfoot>tr>td{padding:0;border:0}.flow>tbody>tr>td{padding:0 13mm}.sp{height:12mm}
.wmk{position:fixed;left:0;top:0;width:210mm;height:297mm;display:flex;align-items:center;justify-content:center;z-index:-1;overflow:hidden}
.wmk span{font:900 96px/1.05 Arial,sans-serif;color:rgba(30,58,138,.13);transform:rotate(-32deg);text-align:center;letter-spacing:6px;max-width:92%}
.wmk img{max-width:62%;max-height:55%;opacity:.15}
.lh{display:flex;align-items:center;gap:14px;border-bottom:3px double #1e3a8a;padding-bottom:10px}.lh img{height:68px;max-width:110px;object-fit:contain}
.lh h1{margin:0;font:800 21px Georgia,serif;color:#1e3a8a;text-transform:uppercase;letter-spacing:.5px}.lh p{margin:2px 0;color:#475569;font-size:11px}
.dt{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 10px;padding:6px 12px;background:#1e3a8a;color:#fff;border-radius:4px}.dt b{font-size:15px;letter-spacing:1px;text-transform:uppercase}.dt span{font-size:11px;color:#cfe0ff}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.kp div{border:1px solid #c9d6f2;border-left:4px solid #1e3a8a;padding:6px 9px;background:rgba(238,243,255,.6);border-radius:3px}.kp small{display:block;font-size:9.5px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}.kp b{font-size:15px;color:#1e3a8a}
h2.sh{font-size:12px;color:#1e3a8a;border-bottom:1.5px solid #1e3a8a;margin:14px 0 6px;padding-bottom:2px;text-transform:uppercase;letter-spacing:.6px}
.dtb,.card table,.sc table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px}.dtb th,.card th,.sc th{background:#1e3a8a;color:#fff;padding:5px 6px;text-align:left;font-size:10px;text-transform:uppercase}
.dtb td,.card td,.sc td{padding:4px 6px;border-bottom:1px solid #d9e2f5}.dtb tbody tr:nth-child(even) td,.card tr:nth-child(even) td{background:rgba(238,243,255,.55)}.dtb tr,.card tr{page-break-inside:avoid}.dtb .r{text-align:right}.dtb tfoot td{font-weight:800;background:#e4ecfc;border-top:2px solid #1e3a8a}
.card{margin-bottom:8px}.card h3,h3{font:700 12px Arial;color:#1e3a8a;text-transform:uppercase;border-bottom:1.5px solid #1e3a8a;padding-bottom:2px;margin:12px 0 6px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.st{border:1px solid #c9d6f2;border-left:4px solid #1e3a8a;padding:6px 9px;border-radius:3px;background:rgba(238,243,255,.6)}.st small{display:block;font-size:9.5px;color:#64748b;text-transform:uppercase}.st b{font-size:15px;color:#1e3a8a}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cx{color:#b91c1c;text-decoration:line-through}.note{font-size:10px;color:#64748b;margin-top:12px;text-align:center}
.pg{height:296mm;padding:12mm;page-break-after:always;overflow:hidden}.pgs>.pg:last-child{page-break-after:auto}
.sig2{display:flex;justify-content:space-between;margin-top:42px}.sig2 div{border-top:1px solid #334155;padding-top:3px;min-width:150px;text-align:center;font-size:11px}`;
const RCSS='';
const wmInner=()=>{const c=S.college;return c.wmImg?`<img src="${c.wmImg}">`:c.wmText?`<span>${H(c.wmText)}</span>`:''};
const contact=()=>{const c=S.college;return [c.phone&&'Ph: '+c.phone,c.email,c.web].filter(Boolean).map(H).join(' &nbsp;|&nbsp; ')};
const lh=()=>{const c=S.college;return `<div class="lh">${c.logo?`<img src="${c.logo}">`:''}<div><h1>${H(c.name)}</h1><p>${H(c.addr)}</p><p>${contact()}</p></div></div>`};
const docHead=(t,sub)=>lh()+`<div class="dt"><b>${H(t)}</b><span>${sub||''}</span></div>`;
const flow=x=>`<table class="flow"><thead><tr><td><div class="sp"></div></td></tr></thead><tbody><tr><td>${x}</td></tr></tbody><tfoot><tr><td><div class="sp"></div></td></tr></tfoot></table>`;
const kpis=a=>`<div class="kp">${a.map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join('')}</div>`;
const dtb=(h,rows,foot)=>`<table class="dtb"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr${r.cx?' class="cx"':''}>${(r.c||r).map(x=>`<td${/^(₹|-?\d[\d,.]*$)/.test(String(x))?' class="r"':''}>${x}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">No records</td></tr>`}</tbody>${foot?`<tfoot><tr>${foot.map(x=>`<td${/^₹/.test(String(x))?' class="r"':''}>${x}</td>`).join('')}</tr></tfoot>`:''}</table>`;
const sign=()=>`<div class="sig2"><div>Prepared by</div><div>Accountant / Office</div><div>Principal</div></div><p class="note">Generated on ${fd(today())} · ${H(S.college.name)} · Computer generated report</p>`;
function printDoc(title,body){const w=open('','_blank');if(!w)return alert('Please allow pop-ups to print / save as PDF');const wm=wmInner();
 w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${H(title)}</title><style>${DCSS}${RCSS}</style></head><body>${wm?`<div class="wmk">${wm}</div>`:''}${body}<script>onload=()=>setTimeout(()=>print(),500)<\/script></body></html>`);w.document.close()}
function printPage(){const t=((TABS.find(x=>x[0]==tab)||[0,tab])[1]).replace(/^\S+\s/,''),c=$('#app').cloneNode(true);
 c.querySelectorAll('.np,button,input,select,datalist,.hero,label').forEach(e=>e.remove());c.querySelectorAll('.st b[data-n]').forEach(e=>e.textContent=e.dataset.m?inr(+e.dataset.n):e.dataset.n);
 printDoc(t,flow(docHead(t,fd(today()))+c.innerHTML+sign()))}
/* ---------- reports ---------- */
function pdfRecords(){const R=L.R||[],v=R.filter(valid),hs=L.hs,am=r=>hs?r.items.filter(i=>i.head==hs).reduce((a,i)=>a+ +i.amt,0):tot(r),sum=v.reduce((a,r)=>a+am(r),0);
 printDoc('Receipt Records',flow(docHead('Receipt Records'+(hs?' — '+hs:''),fd(today()))+kpis([['Records',R.length],['Valid',v.length],['Cancelled',R.length-v.length],[hs?H(hs)+' collected':'Total collection',inr(sum)]])+
 dtb(['Book/Sl','Date','Student','Roll','Purpose','Mode','Amount'],R.map(r=>({cx:r.cancelled,c:[bookOf(r.book).sl+'/'+r.serial,fd(r.date),H(r.name),H(r.roll),[...new Set(r.items.map(i=>H(i.head)))].join(', '),H(r.mode),inr(am(r))]})),['','','','','','TOTAL',inr(sum)])+sign()))}
function report(){const t=$('#rt').value,d=new Date($('#rd').value);let a=new Date(d),b=new Date(d);
 if(t=='Weekly'){a.setDate(d.getDate()-d.getDay());b=new Date(a);b.setDate(a.getDate()+6)}
 if(t=='Monthly'){a=new Date(d.getFullYear(),d.getMonth(),1);b=new Date(d.getFullYear(),d.getMonth()+1,0)}
 if(t=='Yearly'){a=new Date(d.getFullYear(),0,1);b=new Date(d.getFullYear(),11,31)}
 const f=x=>new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10),A1=f(a),B1=f(b);
 const all=S.receipts.filter(r=>r.date>=A1&&r.date<=B1).sort((x,y)=>x.date>y.date?1:-1),R=all.filter(valid),by={},hd={},dy={},dc={};
 R.forEach(r=>{by[r.mode]=(by[r.mode]||0)+tot(r);dy[r.date]=(dy[r.date]||0)+tot(r);dc[r.date]=(dc[r.date]||0)+1;r.items.forEach(i=>hd[i.head]=(hd[i.head]||0)+ +i.amt)});
 const sum=R.reduce((x,r)=>x+tot(r),0);L.repA={t,A1,B1,all,R,by,hd,dy,dc,sum};
 L.rep=[['Report',t,A1+' to '+B1],['Receipts',all.length],['Cancelled',all.length-R.length],['Total (INR)',sum],[],['Mode','Amount (INR)']].concat(Object.entries(by),[[],['Purpose','Amount (INR)']],Object.entries(hd),[[],['Details'],RH],all.map(rr));
 const mini=(h,o)=>`<table><tr><th>${h}</th><th>Amount</th></tr>${Object.entries(o).map(([k,v])=>`<tr><td>${H(k)}</td><td>${inr(v)}</td></tr>`).join('')||'<tr><td colspan=2>No data</td></tr>'}</table>`;
 $('#rp').innerHTML=`<div class="row np" style="margin:10px 0">${xb('xlRep()')}<button class="s" onclick="repPdf()">📄 PDF</button></div><p><b>${t} report: ${fd(A1)} to ${fd(B1)}</b></p><div class="cards"><div class="st"><small>Total collection</small><b>${inr(sum)}</b></div><div class="st"><small>Receipts</small><b>${all.length}</b></div><div class="st"><small>Cancelled</small><b>${all.length-R.length}</b></div></div><div class="g"><div>${mini('Payment mode',by)}</div><div>${mini('Purpose',hd)}</div></div>`}
function repPdf(){const q=L.repA;if(!q)return;
 printDoc(q.t+' Report',flow(docHead(q.t+' Collection Report',fd(q.A1)+' to '+fd(q.B1))+kpis([['Total collection',inr(q.sum)],['Receipts issued',q.all.length],['Cancelled',q.all.length-q.R.length],['Average / receipt',inr(q.R.length?q.sum/q.R.length:0)]])+
 '<h2 class="sh">Payment mode-wise</h2>'+dtb(['Payment mode','Amount'],Object.entries(q.by).map(([k,v])=>[H(k),inr(v)]),['TOTAL',inr(q.sum)])+
 '<h2 class="sh">Purpose-wise (fee heads)</h2>'+dtb(['Purpose','Amount'],Object.entries(q.hd).map(([k,v])=>[H(k),inr(v)]),['TOTAL',inr(Object.values(q.hd).reduce((a,x)=>a+x,0))])+
 (q.t!='Daily'?'<h2 class="sh">Day-wise</h2>'+dtb(['Date','Receipts','Amount'],Object.keys(q.dy).sort().map(k=>[fd(k),q.dc[k],inr(q.dy[k])]),['TOTAL',q.R.length,inr(q.sum)]):'')+
 '<h2 class="sh">Receipt details</h2>'+dtb(['Book/Sl','Date','Student','Roll','Purpose','Mode','Amount'],q.all.map(r=>({cx:r.cancelled,c:[bookOf(r.book).sl+'/'+r.serial,fd(r.date),H(r.name),H(r.roll),[...new Set(r.items.map(i=>H(i.head)))].join(', '),H(r.mode),inr(tot(r))]})))+sign()))}
/* ---------- student statement PDF ---------- */
function stmtPdf(roll){const{st,R,v}=stmtData(roll),tt=v.reduce((a,r)=>a+tot(r),0),hd={};v.forEach(r=>r.items.forEach(i=>hd[i.head]=(hd[i.head]||0)+ +i.amt));
 printDoc('Fee Statement '+roll,flow(docHead('Fee Statement',fd(today()))+dtb(['Student detail','Value'],[['<b>Name</b>',H(st.name)],['<b>Roll / ID</b>',H(st.roll)],['<b>Course / Branch</b>',H(st.course)+' / '+H(st.branch)],['<b>Academic year</b>',H(st.year)||'-']])+
 kpis([['Total paid',inr(tt)],['Receipts',R.length],['Valid',v.length],['Cancelled',R.length-v.length]])+'<h2 class="sh">Receipts</h2>'+
 dtb(['Date','Book/Sl','Particulars','Mode','Amount'],R.map(r=>({cx:r.cancelled,c:[fd(r.date),bookOf(r.book).sl+'/'+r.serial,r.items.map(i=>H(i.head)+' ['+H(i.sem)+'] '+inr(i.amt)).join('<br>'),H(r.mode),r.cancelled?'CANCELLED':inr(tot(r))]})),['','','','TOTAL PAID',inr(tt)])+
 '<h2 class="sh">Purpose-wise</h2>'+dtb(['Purpose','Amount'],Object.entries(hd).map(([k,x])=>[H(k),inr(x)]))+sign()))}

(async()=>{await idb();S=await get('db');if(!S){S=fresh();await put('db',S)}dirty=!!(await get('dirty'));if(!S.mig1){['Laboratory Fees','Library Fees','Caution Money'].forEach(h=>{if(!S.dd.head.includes(h))S.dd.head.push(h)});S.mig1=1;await put('db',S)}
 brand();
 if(sessionStorage.s){ULTRA=sessionStorage.s=='u';start()}else loginView();
 if('serviceWorker' in navigator&&location.protocol.startsWith('http')){/* PWA step later: navigator.serviceWorker.register('sw.js') */}})();
